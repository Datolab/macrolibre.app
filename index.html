<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>MacroLibre</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --fg: #0f172a;
        --muted: #64748b;
        --surface: #ffffff;
        --border: #e2e8f0;
        --accent: #10b981;
        --accent-fg: #052e21;
        --header-bg: #0f172a;
        --header-fg: #e2e8f0;
        --brand: #34d399;
        --header-h: 56px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --surface: #1e293b;
          --border: #334155;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.5;
        background: var(--bg);
        color: var(--fg);
      }
      .app-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: var(--header-h);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1rem;
        background: var(--header-bg);
        color: var(--header-fg);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
        z-index: 20;
      }
      .app-header h1 {
        margin: 0;
        color: var(--brand);
        font-family: "Fredoka", ui-rounded, "SF Pro Rounded", "Segoe UI",
          system-ui, sans-serif;
        font-size: 1.45rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .hamburger {
        background: none;
        border: none;
        color: var(--header-fg);
        font-size: 1.5rem;
        line-height: 1;
        padding: 0.25rem 0.6rem;
        cursor: pointer;
        border-radius: 0.5rem;
      }
      .hamburger:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: calc(var(--header-h) + 1.25rem) 1.25rem 3rem;
      }
      h2 {
        font-size: 1.05rem;
        margin: 1.5rem 0 0.5rem;
      }
      input[type="search"],
      input[type="number"] {
        font: inherit;
        padding: 0.65rem 0.8rem;
        border-radius: 0.6rem;
        border: 1px solid var(--border);
        background: var(--surface);
        color: inherit;
      }
      input[type="search"] {
        width: 100%;
      }
      input[type="number"] {
        width: 6rem;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0.5rem 0;
      }
      li {
        border-bottom: 1px solid var(--border);
      }
      .food-row {
        width: 100%;
        text-align: left;
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        padding: 0.7rem 0.25rem;
        cursor: pointer;
      }
      .food-row:hover {
        color: var(--brand);
      }
      .logged {
        padding: 0.6rem 0.25rem;
      }
      .log-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
      }
      .row-actions {
        display: inline-flex;
        gap: 0.25rem;
        flex-shrink: 0;
      }
      .edit-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .edit-row input[type="number"] {
        width: 5rem;
      }
      button.link {
        font: inherit;
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 0.25rem 0.45rem;
        border-radius: 0.4rem;
      }
      button.link:hover {
        color: var(--fg);
      }
      button.link.danger:hover {
        color: #fb7185;
      }
      button.primary {
        font: inherit;
        padding: 0.55rem 1rem;
        border-radius: 0.6rem;
        border: none;
        background: var(--accent);
        color: var(--accent-fg);
        cursor: pointer;
        font-weight: 600;
      }
      .add {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin: 0.75rem 0;
      }
      .totals {
        font-weight: 700;
        font-size: 1.05rem;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 0.5rem 0 1rem;
      }
      .chip {
        font: inherit;
        padding: 0.45rem 0.85rem;
        border-radius: 1rem;
        border: 1px solid var(--accent);
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      .chip:hover {
        background: var(--accent);
        color: var(--accent-fg);
      }
      .rings {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0.5rem 0 1.5rem;
      }
      .rings svg {
        width: 200px;
        height: 200px;
      }
      .rings-num {
        font-size: 24px;
        font-weight: 800;
        fill: var(--fg);
      }
      .rings-sub {
        font-size: 11px;
        fill: var(--muted);
      }
      .legend {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 0.75rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }
      .legend-item .dot {
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 50%;
        display: inline-block;
      }
      .onboarding label {
        display: block;
        margin: 1.1rem 0 0.25rem;
        font-weight: 600;
      }
      .onboarding input,
      .onboarding select {
        display: block;
        width: 100%;
        font: inherit;
        padding: 0.65rem 0.8rem;
        margin-top: 0.35rem;
        border-radius: 0.6rem;
        border: 1px solid var(--border);
        background: var(--surface);
        color: inherit;
      }
      .onboarding button.primary {
        margin-top: 1.75rem;
      }
      .backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 30;
      }
      .backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }
      .drawer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        max-width: 40rem;
        margin: 0 auto;
        background: var(--surface);
        color: var(--fg);
        border-radius: 1rem 1rem 0 0;
        padding: 0.75rem 1.25rem 2rem;
        transform: translateY(100%);
        transition: transform 0.28s ease;
        z-index: 31;
        box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.35);
      }
      .drawer.open {
        transform: translateY(0);
      }
      .grabber {
        width: 2.5rem;
        height: 0.25rem;
        background: var(--border);
        border-radius: 2px;
        margin: 0.25rem auto 1rem;
      }
      .drawer h3 {
        margin: 1rem 0 0.25rem;
        font-size: 1rem;
      }
      .drawer p {
        margin: 0.25rem 0 0.75rem;
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/Main.res.mjs"></script>
  </body>
</html>
